<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOKSUT | Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 15%, #123c53, transparent 42%), linear-gradient(135deg, #07131e, #0b2535); color: #f4f8fc; }
    .card { width: min(100%, 420px); padding: 38px 32px; background: rgba(15, 34, 49, .94); border: 1px solid #29475a; border-radius: 22px; box-shadow: 0 24px 70px #0005; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .mark { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 15px; background: #1b91bd; font-size: 26px; }
    h1 { margin: 0; font-size: 30px; letter-spacing: 1px; }
    .subtitle { color: #a5b9c8; font-size: 14px; line-height: 1.6; margin: 12px 0 30px; }
    label { display: block; margin: 17px 0 8px; font-size: 13px; font-weight: 650; }
    input { width: 100%; height: 48px; padding: 0 14px; background: #0a1d2b; border: 1px solid #355064; border-radius: 10px; outline: none; color: white; font: inherit; }
    input:focus { border-color: #4fc5ec; box-shadow: 0 0 0 3px #4fc5ec22; }
    button { margin-top: 25px; width: 100%; height: 48px; background: #18a5d5; border: 0; border-radius: 10px; font: inherit; font-weight: 750; color: #05202d; cursor: pointer; }
    button:hover { background: #58c6e8; }
    button:disabled { opacity: .65; cursor: wait; }
    #message { min-height: 20px; margin: 15px 0 0; font-size: 13px; color: #ffb6b6; }
    footer { margin-top: 28px; text-align: center; font-size: 12px; color: #7e9aac; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><div class="mark" aria-hidden="true">⚡</div><h1>DOKSUT</h1></div>
    <p class="subtitle">Doctor of Energy Losses<br>Monitoring, Evaluasi & Pengendalian Susut</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" placeholder="Masukkan username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Masukkan password" autocomplete="current-password" required>
      <button id="loginButton" type="submit">Masuk ke DOKSUT</button>
      <p id="message" role="alert" aria-live="polite"></p>
    </form>
    <footer>PLN Innovation 2027</footer>
  </main>
  <script>
    const SUPABASE_URL = 'https://wtfzctnurmkgjutzqcvc.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_HIlbdDLTdVmztMgYMN77lA_zsvvP2by';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const form = document.getElementById('loginForm');
    const button = document.getElementById('loginButton');
    const message = document.getElementById('message');

    // Pengguna cukup mengetik ID, misalnya 14440. Domain tidak ditampilkan.
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!/^[a-zA-Z0-9._-]+$/.test(username)) {
        message.textContent = 'Format username tidak valid.';
        return;
      }
      button.disabled = true;
      button.textContent = 'Memproses...';
      try {
        const { error } = await client.auth.signInWithPassword({
          email: `${username}@kinerja.internal`,
          password
        });
        if (error) throw error;
        window.location.replace('dashboard.html');
      } catch (error) {
        message.textContent = 'Login gagal. Periksa username dan password.';
        console.error('Supabase login error:', error.message);
      } finally {
        button.disabled = false;
        button.textContent = 'Masuk ke DOKSUT';
      }
    });
  </script>
</body>
</html>
